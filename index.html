<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHARAT — Journey Through Indian Civilization</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --gold: #D4A017;
    --deep-gold: #B8860B;
    --copper: #B87333;
    --parchment: #F5E6C8;
    --sand: #C2B280;
    --royal-blue: #1a237e;
    --deep-black: #050505;
    --antique-white: #FAEBD7;
  }

  html { scroll-behavior: auto; }
  
  body {
    background: #000;
    color: #fff;
    font-family: 'Georgia', serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  #canvas-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  #main-canvas {
    width: 100%; height: 100%;
    display: block;
  }

  #scroll-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }

  #scroll-trigger {
    height: 900vh;
    width: 1px;
  }

  #ui-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
  }

  /* INTRO SCREEN */
  #intro-screen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: all;
  }

  #sanskrit-glyphs {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    opacity: 0;
  }

  .glyph {
    position: absolute;
    color: rgba(212, 160, 23, 0.3);
    font-size: 24px;
    animation: floatGlyph 8s ease-in-out infinite;
    font-family: 'Noto Sans Devanagari', 'Arial Unicode MS', serif;
  }

  @keyframes floatGlyph {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
    50% { transform: translateY(-30px) rotate(5deg); opacity: 0.6; }
  }

  #intro-flame {
    width: 80px;
    height: 120px;
    position: relative;
    margin-bottom: 40px;
    opacity: 0;
  }

  #bharat-title {
    font-size: clamp(60px, 10vw, 120px);
    font-weight: 400;
    letter-spacing: 0.3em;
    background: linear-gradient(135deg, #D4A017, #FFD700, #B8860B, #D4A017);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
    font-family: 'Palatino Linotype', 'Book Antiqua', serif;
    text-transform: uppercase;
    filter: drop-shadow(0 0 30px rgba(212, 160, 23, 0.8));
  }

  #bharat-subtitle {
    font-size: clamp(14px, 2vw, 20px);
    letter-spacing: 0.6em;
    color: rgba(212, 160, 23, 0.7);
    margin-top: 20px;
    opacity: 0;
    text-transform: uppercase;
    font-family: 'Gill Sans', sans-serif;
  }

  #scroll-hint {
    position: absolute;
    bottom: 60px;
    opacity: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  #scroll-hint span {
    font-size: 11px;
    letter-spacing: 0.4em;
    color: rgba(212, 160, 23, 0.6);
    text-transform: uppercase;
  }

  .scroll-arrow {
    width: 2px;
    height: 40px;
    background: linear-gradient(to bottom, transparent, rgba(212, 160, 23, 0.8));
    animation: scrollPulse 2s ease-in-out infinite;
  }

  @keyframes scrollPulse {
    0%, 100% { opacity: 0.3; transform: scaleY(0.8); }
    50% { opacity: 1; transform: scaleY(1); }
  }

  /* ERA INFO PANEL */
  #era-panel {
    position: fixed;
    left: 5%;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    max-width: 380px;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }

  #era-year {
    font-size: 13px;
    letter-spacing: 0.5em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
    font-family: 'Courier New', monospace;
  }

  #era-name {
    font-size: clamp(28px, 4vw, 52px);
    font-family: 'Palatino Linotype', serif;
    background: linear-gradient(135deg, #FFD700, #D4A017, #B8860B);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    margin-bottom: 20px;
  }

  #era-description {
    font-size: 15px;
    line-height: 1.8;
    color: rgba(245, 230, 200, 0.85);
    margin-bottom: 25px;
    font-family: 'Georgia', serif;
  }

  #era-facts {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .fact-item {
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transform: translateX(-20px);
    transition: all 0.5s ease;
  }

  .fact-item.visible {
    opacity: 1;
    transform: translateX(0);
  }

  .fact-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
    box-shadow: 0 0 8px rgba(212, 160, 23, 0.8);
  }

  .fact-text {
    font-size: 13px;
    color: rgba(212, 160, 23, 0.8);
    letter-spacing: 0.05em;
    font-family: 'Courier New', monospace;
  }

  /* SCENE IMAGE */
  #scene-image-container {
    position: fixed;
    right: 5%;
    top: 50%;
    transform: translateY(-50%);
    z-index: 15;
    width: 45%;
    max-width: 600px;
    opacity: 0;
    transition: opacity 1s ease;
    pointer-events: none;
  }

  #scene-image {
    width: 100%;
    border-radius: 4px;
    filter: sepia(20%) contrast(1.1) brightness(0.9);
    box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 30px rgba(212, 160, 23, 0.2);
    border: 1px solid rgba(212, 160, 23, 0.3);
  }

  #image-caption {
    text-align: center;
    margin-top: 12px;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: rgba(212, 160, 23, 0.5);
    text-transform: uppercase;
  }

  /* TIMELINE */
  #timeline {
    position: fixed;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    display: flex;
    flex-direction: column;
    gap: 20px;
    opacity: 0;
    pointer-events: all;
    transition: opacity 1s ease 3s;
  }

  .timeline-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(212, 160, 23, 0.3);
    border: 1px solid rgba(212, 160, 23, 0.5);
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }

  .timeline-dot:hover, .timeline-dot.active {
    background: var(--gold);
    box-shadow: 0 0 12px rgba(212, 160, 23, 0.8);
    transform: scale(1.5);
  }

  .timeline-dot .dot-label {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(212, 160, 23, 0.6);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s ease;
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
  }

  .timeline-dot:hover .dot-label {
    opacity: 1;
  }

  /* FLAME CURSOR */
  #flame-cursor {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    width: 30px;
    height: 50px;
    transform: translate(-50%, -50%);
    mix-blend-mode: screen;
  }

  /* PROGRESS BAR */
  #progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(to right, var(--gold), #FFD700);
    z-index: 30;
    transition: width 0.1s ease;
    box-shadow: 0 0 10px rgba(212, 160, 23, 0.8);
  }

  /* FINAL QUOTE */
  #final-quote {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    max-width: 800px;
    padding: 0 40px;
  }

  #final-quote-text {
    font-size: clamp(20px, 3vw, 36px);
    font-family: 'Palatino Linotype', serif;
    color: var(--parchment);
    line-height: 1.6;
    font-style: italic;
  }

  #final-quote-text span {
    color: var(--gold);
  }

  #india-map-overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 18;
    opacity: 0;
    pointer-events: none;
    filter: drop-shadow(0 0 40px rgba(212, 160, 23, 0.6));
  }

  /* MOBILE */
  @media (max-width: 768px) {
    #era-panel { left: 20px; max-width: calc(100% - 40px); }
    #scene-image-container { display: none; }
    #timeline { display: none; }
    #era-panel { top: 30%; }
  }

  /* PARTICLE OVERLAY */
  #particle-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    pointer-events: none;
  }

  /* VIGNETTE */
  #vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
    z-index: 8;
    pointer-events: none;
  }

  /* GRAIN OVERLAY */
  #grain {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 9;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px;
  }

  /* LOADING */
  #loading-screen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
  }

  #loading-text {
    font-size: 12px;
    letter-spacing: 0.5em;
    color: rgba(212, 160, 23, 0.6);
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
  }

  #loading-bar-container {
    width: 200px;
    height: 1px;
    background: rgba(212, 160, 23, 0.2);
  }

  #loading-bar {
    height: 100%;
    background: var(--gold);
    width: 0%;
    transition: width 0.3s ease;
    box-shadow: 0 0 10px var(--gold);
  }

  /* ERA TRANSITION */
  #era-transition {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 40;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(ellipse at center, rgba(212, 160, 23, 0.1) 0%, transparent 70%);
  }

  /* FLOATING PARTICLES */
  .floating-particle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212, 160, 23, 0.8), transparent);
    pointer-events: none;
    animation: particleFloat linear infinite;
  }

  @keyframes particleFloat {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
  }
</style>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

<div id="loading-screen">
  <div style="font-size:32px;color:rgba(212,160,23,0.8);letter-spacing:0.4em;font-family:'Palatino Linotype',serif;">BHARAT</div>
  <div id="loading-text">Awakening Ancient Civilizations...</div>
  <div id="loading-bar-container">
    <div id="loading-bar"></div>
  </div>
</div>

<canvas id="main-canvas"></canvas>
<canvas id="particle-canvas"></canvas>

<div id="scroll-container">
  <div id="scroll-trigger"></div>
</div>

<div id="vignette"></div>
<div id="grain"></div>

<!-- INTRO SCREEN -->

  <div id="intro-flame">

          <animate attributeName="d" dur="2s" repeatCount="indefinite" values="M40 110 C20 90 10 60 25 40 C15 55 30 45 35 30 C30 50 45 45 40 20 C50 40 60 35 55 55 C65 40 60 70 50 80 C65 65 68 85 40 110Z;M40 110 C22 88 12 58 27 38 C17 53 32 43 37 28 C32 48 47 43 42 18 C52 38 62 33 57 53 C67 38 62 68 52 78 C67 63 70 83 40 110Z;M40 110 C20 90 10 60 25 40 C15 55 30 45 35 30 C30 50 45 45 40 20 C50 40 60 35 55 55 C65 40 60 70 50 80 C65 65 68 85 40 110Z"/>

  </div>
  
  <div id="bharat-title">BHARAT</div>
  <div id="bharat-subtitle">5000 Years of Civilization</div>
  
  <div id="scroll-hint">
    <span>Scroll to Begin the Journey</span>
    <div class="scroll-arrow"></div>
  </div>
</div>

<!-- UI OVERLAY -->
<div id="ui-overlay">
  <div id="progress-bar" style="width:0%"></div>
  
  <!-- ERA PANEL -->
  <div id="era-panel">
    <div id="era-year"></div>
    <div id="era-name"></div>
    <div id="era-description"></div>
    <div id="era-facts"></div>
  </div>
  
  <!-- SCENE IMAGE -->
  <div id="scene-image-container">
    <img id="scene-image" src="" alt="" />
    <div id="image-caption"></div>
  </div>
  
  <!-- TIMELINE -->
  <div id="timeline"></div>
  
  <!-- FINAL QUOTE -->
  <div id="final-quote">
    <div id="final-quote-text">
      <span>"India is not merely a nation —<br>it is a civilization."</span>
      <div style="margin-top:30px;font-size:14px;letter-spacing:0.4em;color:rgba(212,160,23,0.6);font-style:normal;text-transform:uppercase;">5000 BCE — Present Day</div>
    </div>
  </div>

  <!-- INDIA MAP SVG -->
  <div id="india-map-overlay">
    <svg width="300" height="360" viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="mapGrad" cx="50%" cy="40%">
          <stop offset="0%" stop-color="#FFD700" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#B8860B" stop-opacity="0.6"/>
        </radialGradient>
        <filter id="mapGlow">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>

      </defs>
      <g filter="url(#mapGlow)">
        <path d="M150 20 C160 20 200 30 220 50 C240 70 250 90 240 110 C255 120 260 140 250 160 C260 170 265 190 255 210 C260 230 250 250 240 260 C235 280 230 290 220 295 C210 305 200 310 195 315 C185 325 175 335 165 340 C160 345 155 350 150 355 C145 350 140 345 135 340 C125 335 115 325 105 315 C100 310 90 305 80 295 C70 290 65 280 60 260 C50 250 40 230 45 210 C35 190 40 170 50 160 C40 140 45 120 60 110 C50 90 60 70 80 50 C100 30 140 20 150 20Z" fill="url(#mapGrad)" opacity="0.8" stroke="rgba(255,215,0,0.5)" stroke-width="1"/>

        <path d="M130 20 C140 15 160 12 170 18 C175 25 170 35 160 38 C150 35 135 30 130 20Z" fill="rgba(255,215,0,0.6)" stroke="rgba(255,215,0,0.3)" stroke-width="0.5"/>
      </g>
    </svg>
  </div>
</div>

<!-- ERA TRANSITION FLASH -->
<div id="era-transition"></div>

<!-- FLAME CURSOR -->
<div id="flame-cursor">
  <svg viewBox="0 0 30 50" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="cursorFlame" cx="50%" cy="80%" r="70%">
        <stop offset="0%" stop-color="#FFD700"/>
        <stop offset="60%" stop-color="#FF6600"/>
        <stop offset="100%" stop-color="#FF2200" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <path d="M15 48 C8 38 4 25 10 15 C6 22 12 18 13 10 C11 18 17 16 15 5 C19 14 23 12 21 20 C25 13 23 28 19 32 C25 24 26 36 15 48Z" fill="url(#cursorFlame)" opacity="0.9"/>
  </svg>
</div>

<script>
// ============================================
// BHARAT - JOURNEY THROUGH INDIAN CIVILIZATION
// ============================================

gsap.registerPlugin(ScrollTrigger);

// ============================================
// DATA
// ============================================

function createFlameSystem() {
  const group = new THREE.Group();
  
  // Core flame
  const coreGeo = new THREE.SphereGeometry(0.15, 16, 16);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
  const core = new THREE.Mesh(coreGeo, coreMat);
  group.add(core);
  
  // Flame particles
  const particleCount = 100;
  const positions = new Float32Array(particleCount * 3);
  const sizes = new Float32Array(particleCount);
  const alphas = new Float32Array(particleCount);
  const velocities = [];
  
  for (let i = 0; i < particleCount; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 0.3;
    positions[i * 3 + 1] = Math.random() * 2;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
    sizes[i] = Math.random() * 8 + 2;
    alphas[i] = Math.random();
    velocities.push({
      x: (Math.random() - 0.5) * 0.01,
      y: Math.random() * 0.02 + 0.01,
      z: (Math.random() - 0.5) * 0.01,
      life: Math.random()
    });
  }
  
  const particleGeo = new THREE.BufferGeometry();
  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  
  const particleMat = new THREE.PointsMaterial({
    color: 0xFF6600,
    size: 0.1,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  });
  
  const particles = new THREE.Points(particleGeo, particleMat);
  group.add(particles);
  
  group.userData = { 
    particles, 
    positions, 
    velocities, 
    particleGeo, 
    core, 
    coreMat 
  };
  
  scene.add(group);
  return group;
}

  const geo = new THREE.BufferGeometry();

const pCanvas = document.getElementById('particle-canvas');
const pCtx = pCanvas.getContext('2d');
pCanvas.width = window.innerWidth;
pCanvas.height = window.innerHeight;

const canvasParticles = [];

function spawnGoldParticle() {
  const angle = Math.random() * Math.PI * 2;
  const speed = Math.random() * 2 + 0.5;
  canvasParticles.push({
    x: window.innerWidth / 2 + (Math.random() - 0.5) * 200,
    y: window.innerHeight / 2 + (Math.random() - 0.5) * 100,
    vx: Math.cos(angle) * speed * 0.5,
    vy: -Math.random() * 2 - 0.5,
    size: Math.random() * 3 + 1,
    alpha: 1,
    color: `hsl(${40 + Math.random() * 20}, 100%, ${50 + Math.random() * 20}%)`
  });
}

function updateCanvasParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  
  for (let i = canvasParticles.length - 1; i >= 0; i--) {
    const p = canvasParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.02;
    p.alpha -= 0.008;
    
    if (p.alpha <= 0) {
      canvasParticles.splice(i, 1);
      continue;
    }
    
    pCtx.save();
    pCtx.globalAlpha = p.alpha;
    pCtx.fillStyle = p.color;
    pCtx.shadowColor = p.color;
    pCtx.shadowBlur = 8;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    pCtx.fill();
    pCtx.restore();
  }
}

// ============================================
// ERA TRANSITION
// ============================================
function updateEra(eraIndex) {
  if (eraIndex === currentEraIndex) return;
  currentEraIndex = eraIndex;
  
  const era = ERAS[eraIndex];
  if (!era) return;
  
  // Era transition flash
  gsap.fromTo('#era-transition', 
    { opacity: 0.5 },
    { opacity: 0, duration: 1, ease: 'power2.out' }
  );
  
  // Update panel
  const panel = document.getElementById('era-panel');
  gsap.to(panel, { opacity: 0, duration: 0.3, onComplete: () => {
    document.getElementById('era-year').textContent = era.year;
    document.getElementById('era-name').textContent = era.name;
    document.getElementById('era-description').textContent = era.description;
    
    // Facts
    const factsContainer = document.getElementById('era-facts');
    factsContainer.innerHTML = '';
    era.facts.forEach((fact, i) => {
      const item = document.createElement('div');
      item.className = 'fact-item';
      item.innerHTML = `<div class="fact-dot"></div><span class="fact-text">${fact}</span>`;
      factsContainer.appendChild(item);
      
      setTimeout(() => {
        item.classList.add('visible');
      }, 200 + i * 150);
    });
    
    gsap.to(panel, { opacity: 1, duration: 0.8, ease: 'power2.out' });
  }});
  
  // Update image
  const imgContainer = document.getElementById('scene-image-container');
  gsap.to(imgContainer, { opacity: 0, duration: 0.5, onComplete: () => {
    const img = document.getElementById('scene-image');
    img.src = era.imageUrl;
    img.onload = () => {
      document.getElementById('image-caption').textContent = era.imageCaption;
      gsap.to(imgContainer, { opacity: 1, duration: 1, ease: 'power2.out' });
    };
    img.onerror = () => {
      // Fallback gradient
      img.src = '';
      gsap.to(imgContainer, { opacity: 0.5 });
    };
  }});
  
  // Update scene colors
  gsap.to(scene.fog.color, {
    r: parseInt(era.bgColor.slice(1,3), 16) / 255,
    g: parseInt(era.bgColor.slice(3,5), 16) / 255,
    b: parseInt(era.bgColor.slice(5,7), 16) / 255,
    duration: 2
  });
  
  // Update flame color
  const eraColor = new THREE.Color(era.color);
  gsap.to(flameLight.color, {
    r: eraColor.r,
    g: eraColor.g,
    b: eraColor.b,
    duration: 1.5
  });
  
  // Update floating geo colors
  floatingObjects.forEach(obj => {
    gsap.to(obj.material.color, {
      r: eraColor.r,
      g: eraColor.g,
      b: eraColor.b,
      duration: 2
    });
  });
  
  // Update timeline
  document.querySelectorAll('.timeline-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === eraIndex);
  });
  
  // Spawn particles
  for (let i = 0; i < 50; i++) spawnGoldParticle();
}

// Wheel scroll
window.addEventListener('wheel', (e) => {
  if (!isIntroComplete) return;
  scrollY = Math.max(0, Math.min(maxScroll, scrollY + e.deltaY));
  const newProgress = scrollY / maxScroll;
  targetScrollProgress = Math.max(0, Math.min(0.95, newProgress));
});

// Touch scroll
let touchStartY = 0;
window.addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('touchmove', (e) => {
  if (!isIntroComplete) return;
  const delta = touchStartY - e.touches[0].clientY;
  touchStartY = e.touches[0].clientY;
  scrollY = Math.max(0, Math.min(maxScroll, scrollY + delta * 3));
  const newProgress = scrollY / maxScroll;
  targetScrollProgress = Math.max(0, Math.min(0.95, newProgress));
}, { passive: true });

// ============================================
// CAMERA & FLAME ANIMATION
// ============================================
const cameraTarget = new THREE.Vector3(0, 2, 10);
const lookTarget = new THREE.Vector3(0, 0, 0);
let flameTargetPos = new THREE.Vector3(0, 0, 0);

function updateScene(progress) {
  // Flame moves along path
  const flameProgress = Math.min(progress * 1.05, 0.999);
  const flamePos = curve.getPoint(flameProgress);
  
  flameTargetPos.lerp(flamePos, 0.05);
  flameGroup.position.copy(flameTargetPos);
  flameLight.position.copy(flameTargetPos);
  flameLight.position.y += 0.5;
  
  // Camera follows flame with offset
  const cameraOffset = new THREE.Vector3(0, 2, 8);
  const cameraIdeal = flameTargetPos.clone().add(cameraOffset);
  camera.position.lerp(cameraIdeal, 0.03);
  
  // Camera looks at flame
  lookTarget.lerp(flameTargetPos, 0.05);
  camera.lookAt(lookTarget);
  
  // Determine current era
  const eraProgress = progress * ERAS.length;
  const newEraIndex = Math.min(Math.floor(eraProgress), ERAS.length - 1);
  
  if (isIntroComplete && progress > 0.01) {
    if (document.getElementById('era-panel').style.opacity === '0') {
      document.getElementById('era-panel').style.opacity = '1';
    }
    updateEra(newEraIndex);
  }
  
  // Progress bar
  document.getElementById('progress-bar').style.width = (progress * 100) + '%';
  
  // Final quote
  if (progress > 0.9) {
    const finalOpacity = (progress - 0.9) / 0.05;
    document.getElementById('final-quote').style.opacity = Math.min(finalOpacity, 1).toString();
    document.getElementById('india-map-overlay').style.opacity = Math.min(finalOpacity * 0.8, 0.8).toString();
    
    if (finalOpacity > 0.5) {
      document.getElementById('era-panel').style.opacity = '0';
      document.getElementById('scene-image-container').style.opacity = '0';
    }
    
    // Animate India map
    const scale = 0.5 + finalOpacity * 0.5;
    document.getElementById('india-map-overlay').style.transform = `translate(-50%, -50%) scale(${scale})`;
  } else {
    document.getElementById('final-quote').style.opacity = '0';
    document.getElementById('india-map-overlay').style.opacity = '0';
  }
}

// ============================================
// FLAME ANIMATION
// ============================================
function animateFlame(time) {
  const { particles, positions, velocities, particleGeo } = flameGroup.userData;
  
  for (let i = 0; i < velocities.length; i++) {
    const v = velocities[i];
    v.life += 0.02;
    
    if (v.life >= 1) {
      v.life = 0;
      positions[i * 3] = (Math.random() - 0.5) * 0.2;
      positions[i * 3 + 1] = 0;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 0.2;
      v.x = (Math.random() - 0.5) * 0.02;
      v.y = Math.random() * 0.03 + 0.01;
      v.z = (Math.random() - 0.5) * 0.02;
    } else {
      positions[i * 3] += v.x + Math.sin(time * 3 + i) * 0.003;
      positions[i * 3 + 1] += v.y;
      positions[i * 3 + 2] += v.z;
    }
  }
  
  particleGeo.attributes.position.needsUpdate = true;
  
  // Flicker
  flameLight.intensity = 2.5 + Math.sin(time * 10) * 0.5 + Math.random() * 0.5;
  
  // Pulsate flame color
  const hue = (time * 20) % 60;
  particles.material.color.setHSL(hue / 360, 1, 0.5);
}

// ============================================
// MAIN RENDER LOOP
// ============================================
function animate() {
  requestAnimationFrame(animate);
  
  const time = clock.getElapsedTime();
  const delta = clock.getDelta();
  
  // Smooth scroll
  scrollProgress += (targetScrollProgress - scrollProgress) * 0.04;
  
  // Update cursor
  cursorX += (mouseX - cursorX) * 0.1;
  cursorY += (mouseY - cursorY) * 0.1;
  flameCursor.style.left = cursorX + 'px';
  flameCursor.style.top = cursorY + 'px';
  
  // Animate flame
  animateFlame(time);
  
  // Rotate floating objects
  floatingObjects.forEach((obj) => {
    obj.rotation.x += obj.userData.rotSpeed.x;
    obj.rotation.y += obj.userData.rotSpeed.y;
    obj.rotation.z += obj.userData.rotSpeed.z;
  });
  
  // Animate background particles
  bgParticles.rotation.y = time * 0.01;
  bgParticles.rotation.x = Math.sin(time * 0.005) * 0.05;
  
  // Ground color update
  if (currentEraIndex >= 0 && currentEraIndex < ERAS.length) {
    const era = ERAS[currentEraIndex];
    const targetColor = new THREE.Color(era.bgColor);
    groundMat.color.lerp(targetColor, 0.01);
  }
  
  // Scene update
  if (isIntroComplete) {
    updateScene(scrollProgress);
  }
  
  // Canvas particles
  if (canvasParticles.length < 300 && isIntroComplete) {
    if (Math.random() < 0.1) spawnGoldParticle();
  }
  updateCanvasParticles();
  
  renderer.render(scene, camera);
}

// ============================================
// LOADING SEQUENCE
// ============================================
function simulateLoading() {
  const bar = document.getElementById('loading-bar');
  const texts = [
    'Awakening Ancient Civilizations...',
    'Loading Sacred Manuscripts...',
    'Igniting the History Flame...',
    'Preparing Your Journey...'
  ];
  let progress = 0;
  let textIndex = 0;
  
  const interval = setInterval(() => {
    progress += Math.random() * 15 + 5;
    if (progress > 100) progress = 100;
    bar.style.width = progress + '%';
    
    if (progress > (textIndex + 1) * 25) {
      textIndex = Math.min(textIndex + 1, texts.length - 1);
      document.getElementById('loading-text').textContent = texts[textIndex];
    }
    
    if (progress >= 100) {
      clearInterval(interval);
      setTimeout(() => {
        gsap.to('#loading-screen', {
          opacity: 0,
          duration: 1,
          ease: 'power2.inOut',
          onComplete: () => {
            document.getElementById('loading-screen').style.display = 'none';
            playIntro();
          }
        });
      }, 500);
    }
  }, 100);
}

// ============================================
// RESIZE
// ============================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
});

// ============================================
// INIT
// ============================================
generateGlyphs();
buildTimeline();
animate();

// Start loading after brief pause
setTimeout(simulateLoading, 500);

// ============================================
// KEYBOARD NAVIGATION
// ============================================
window.addEventListener('keydown', (e) => {
  if (!isIntroComplete) return;
  const step = 0.1;
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
    targetScrollProgress = Math.min(targetScrollProgress + step, 0.95);
    scrollY = targetScrollProgress * maxScroll;
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    targetScrollProgress = Math.max(targetScrollProgress - step, 0);
    scrollY = targetScrollProgress * maxScroll;
  }
});

// ============================================
// SPECIAL EFFECTS: INTRO PARTICLE BURST
// ============================================
function burstParticles() {
  for (let i = 0; i < 100; i++) {
    setTimeout(() => spawnGoldParticle(), i * 20);
  }
}

setTimeout(burstParticles, 3000);

// ============================================
// AMBIENT LIGHT PULSE
// ============================================
setInterval(() => {
  if (!isIntroComplete) return;
  gsap.to(ambientLight, {
    intensity: 0.8 + Math.random() * 0.4,
    duration: 1.5,
    ease: 'sine.inOut'
  });
}, 2000);

// ============================================
// FLOATING TEXT DECORATIONS
// ============================================
const floatingTexts = ['ॐ', '🔥', '✦', '◈'];
function spawnFloatingDecor() {
  if (!isIntroComplete) return;
  
  const div = document.createElement('div');
  div.style.cssText = `
    position: fixed;
    font-size: ${10 + Math.random() * 16}px;
    color: rgba(212,160,23,${0.1 + Math.random() * 0.3});
    left: ${Math.random() * 100}vw;
    bottom: -30px;
    z-index: 6;
    pointer-events: none;
    font-family: 'Noto Sans Devanagari', serif;
  `;
  div.textContent = floatingTexts[Math.floor(Math.random() * floatingTexts.length)];
  document.body.appendChild(div);
  
  gsap.to(div, {
    y: -(window.innerHeight + 60),
    x: (Math.random() - 0.5) * 100,
    opacity: 0,
    duration: 8 + Math.random() * 4,
    ease: 'none',
    onComplete: () => div.remove()
  });
}

setInterval(spawnFloatingDecor, 3000);

// ============================================
// PARALLAX ON MOUSE MOVE
// ============================================
document.addEventListener('mousemove', (e) => {
  if (!isIntroComplete) return;
  
  const x = (e.clientX / window.innerWidth - 0.5) * 2;
  const y = (e.clientY / window.innerHeight - 0.5) * 2;
  
  gsap.to(camera.rotation, {
    z: x * 0.02,
    duration: 1,
    ease: 'power2.out'
  });
});

// Era panel hover interactivity
document.getElementById('era-panel').style.pointerEvents = 'none';

// Custom cursor hide
document.body.style.cursor = 'none';

console.log('%cBHARAT — Journey Through Indian Civilization', 'color: #D4A017; font-size: 20px; font-weight: bold;');
console.log('%c5000 Years of History. One Eternal Flame.', 'color: #B8860B; font-size: 14px;');
</script>
</body>
